apiVersion: v1
kind: Pod
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  hostNetwork: true
  containers:
    - name: kafka
      image: docker.io/confluentinc/cp-kafka:__CONFLUENT_IMAGE_TAG__
      ports:
        - name: broker-external
          containerPort: 9092
          protocol: TCP
        - name: broker-internal
          containerPort: 29092
          protocol: TCP
        - name: controller
          containerPort: 29093
          protocol: TCP
      env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
        - name: KAFKA_LISTENERS
          value: "EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:29093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "EXTERNAL://localhost:9092,INTERNAL://__NODE_IP__:29092"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "INTERNAL"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@__NODE_IP__:29093"
        - name: CLUSTER_ID
          value: "__KAFKA_CLUSTER_ID__"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
      readinessProbe:
        exec:
          command:
            - sh
            - -c
            - "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null"
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
      livenessProbe:
        exec:
          command:
            - sh
            - -c
            - "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null"
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
