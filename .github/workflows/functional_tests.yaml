name: Splunk Otel Kafka Connector Functional Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  GO_VERSION: 1.24.4
  # Make sure to exit early if cache segment download times out after 2 minutes.
  # We limit cache download as a whole to 5 minutes.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
  CI_SPLUNK_VERSION: 10.0.0
  CI_SPLUNK_HOST: localhost
  CI_SPLUNK_USERNAME: admin
  CI_SPLUNK_HEC_TOKEN: "00000000-0000-0000-0000-0000000000000"
  CI_SPLUNK_PASSWORD: helloworld
  CI_SPLUNK_MGMT_PORT: 8089
  CI_KAFKA_BROKER_ADDRESS: "localhost:9092"
  CI_OTEL_BINARY_FILE: "otelcol_linux_amd64"
  CI_SPLUNK_INDEX: kafka



jobs:
  functional-test:
    name: functional test (${{ matrix.kafka_environment.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka_environment:
          - name: kafka-3.8.1
            compose_file: ./.github/docker_files/kafka_docker_compose.yaml
            image_tag: "7.8.10"
          - name: kafka-4.3.1
            compose_file: ./.github/docker_files/kafka_kraft_docker_compose.yaml
            image_tag: "8.3.1"
    env:
      CI_SPLUNK_HEADER_TEST_INDEX: kafka-header-index
      KAFKA_COMPOSE_FILE: ${{ matrix.kafka_environment.compose_file }}
      CONFLUENT_IMAGE_TAG: ${{ matrix.kafka_environment.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/setup_env
      - name: Run Tests
        working-directory: tests
        run: |
          mkdir logs 
          ls -laih
          go test ./functional_tests/functional_test.go -v -timeout 12m
      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: otel-collector-logs-${{ matrix.kafka_environment.name }}
          path: ./tests/logs/
          retention-days: 5
        if: always()

  performance-test:
    name: perf test (${{ matrix.kafka_environment.name }}, record size:${{matrix.kafka.record_size }}, num records:${{matrix.kafka.num_records}})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka_environment:
          - name: kafka-3.8.1
            compose_file: ./.github/docker_files/kafka_docker_compose.yaml
            image_tag: "7.8.10"
          - name: kafka-4.3.1
            compose_file: ./.github/docker_files/kafka_kraft_docker_compose.yaml
            image_tag: "8.3.1"
        kafka:
          - num_records: "1000000"
            record_size: "1000"
            throughput: "-1"
          - num_records: "1000000"
            record_size: "300"
            throughput: "-1"
          - num_records: "1000000"
            record_size: "600"
            throughput: "-1"
          - num_records: "10000"
            record_size: "100000"
            throughput: "-1"
          - num_records: "10000000"
            record_size: "100"
            throughput: "-1"
          - num_records: "10000000"
            record_size: "10"
            throughput: "-1"
    env:
      NUM_MSG: ${{matrix.kafka.num_records}}
      RECORD_SIZE: ${{matrix.kafka.record_size}}
      TOPIC_NAME: "kafka-perf-test"
      KAFKA_COMPOSE_FILE: ${{ matrix.kafka_environment.compose_file }}
      CONFLUENT_IMAGE_TAG: ${{ matrix.kafka_environment.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/setup_env
      - name: Run Tests
        working-directory: tests
        run: |
          go test ./performance_tests/performance_test.go -v -timeout 12m